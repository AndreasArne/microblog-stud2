---
-   name: Start the MySQL container
    community.docker.docker_container:
        name: mysql
        image: mysql:5.7
        state: started
        restart_policy: unless-stopped
        published_ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        env:
            MYSQL_ROOT_PASSWORD: "{{ mysql_root_password }}"
            MYSQL_DATABASE: microblog
            MYSQL_USER: microblog
            MYSQL_PASSWORD: "{{ db_password }}"
        command: "--performance-schema=off --innodb-buffer-pool-size=64M --max-connections=50"

-   name: Wait until MySQL accepts the app user
    command: docker exec mysql mysql -umicroblog -p{{ db_password }} -e "select 1" microblog
    register: mysql_ready
    until: mysql_ready.rc == 0
    retries: 30
    delay: 10
    changed_when: false
    no_log: true
