---
-   name: Start the MySQL container
    # Low memory settings, the VM has 1 GB. The data is in a named volume so it survives a restart of the container.
    community.docker.docker_container:
        name: mysql
        image: mysql:5.7
        state: started
        restart_policy: unless-stopped
        published_ports:
            - "3306:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        env:
            MYSQL_ROOT_PASSWORD: "{{ db_root_password }}"
            MYSQL_DATABASE: microblog
            MYSQL_USER: microblog
            MYSQL_PASSWORD: "{{ db_password }}"
        command:
            - --performance-schema=off
            - --innodb-buffer-pool-size=64M
            - --max-connections=50
    no_log: true

-   name: Wait until the app user can log in to MySQL
    command: docker exec -e MYSQL_PWD={{ db_password }} mysql mysql -umicroblog microblog -e "select 1"
    register: mysql_login
    until: mysql_login.rc == 0
    retries: 40
    delay: 10
    changed_when: false
    no_log: true
