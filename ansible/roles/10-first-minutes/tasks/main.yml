---
-   name: Update apt-cache and upgrade
    apt:
        force_apt_get: yes
        update_cache: "True"
        cache_valid_time: 3600
        upgrade: yes

-   name: Install packages
    apt:
        force_apt_get: yes
        name: "{{ packages }}"

-   name: Create a swap file
    # The VMs have 1 GB RAM. The load balancer VM also runs Docker and MySQL, without swap it can run out of memory
    # during the first start of MySQL and then stops answering on SSH.
    command: fallocate -l 1G /swapfile
    args:
        creates: /swapfile

-   name: Set the permissions of the swap file
    file:
        path: /swapfile
        owner: root
        group: root
        mode: "600"

-   name: Format and enable the swap file
    shell: mkswap /swapfile && swapon /swapfile
    when: ansible_swaptotal_mb == 0

-   name: Enable the swap file at boot
    lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"
        regexp: '^/swapfile '
        state: present

-   name: Copy unattended upgrades 10 settings
    copy:
        mode: "644"
        src: files/apt_periodic
        dest: /etc/apt/apt.conf.d/10periodic

-   name: Copy unattended upgrades 50 settings
    copy:
        mode: "644"
        src: files/apt_periodic_50
        dest: /etc/apt/apt.conf.d/50unattended-upgrades

-   name: Create user
    user:
        name: "{{ server_user }}"
        state: present
        shell: /bin/bash
        groups: "{{ server_user_groups }}"

-   name: Add ssh-key for new user
    authorized_key:
        user: "{{ server_user }}"
        state: present
        key: "{{ lookup('file', item) }}"
    with_fileglob: "{{ ssh_keys_dir }}/*.pub"


-   name: Add user to sudoers
    lineinfile:
        dest: /etc/sudoers
        regexp: "{{ server_user }} ALL"
        line: "{{ server_user }} ALL=(ALL) NOPASSWD:ALL"
        state: present
        validate: '/usr/sbin/visudo -cf %s' # kan få fel med line "{{ server_user }} testing"

-   name: Recommended SSH configuration (Mozilla Modern), no root and no password login
    template:
        src: sshd_config.j2
        dest: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: "644"
        validate: '/usr/sbin/sshd -t -f %s' # a broken file would lock us out, sshd -t refuses it before it is written
    notify: restart ssh

-   name: flush handlers to restart SSH
    meta: flush_handlers # we cant do it later because after this we cant ssh as root

-   name: Only allow user to ssh
    lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^AllowUsers"
        line: "AllowUsers {{ server_user }}"
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
    register: allow_users
    # No notify: the handler would run at the end of the play as azureuser, who is removed below.
    # ignore_errors: yes

-   name: Remove default user
    remote_user: "{{ server_user }}"
    user:
        name: azureuser
        state: absent
        force: yes
        remove: yes
    # ignore_errors: yes

-   name: Restart ssh so that AllowUsers is used, as the new user since azureuser is gone
    remote_user: "{{ server_user }}"
    service:
        name: ssh
        state: restarted
    when: allow_users is changed
