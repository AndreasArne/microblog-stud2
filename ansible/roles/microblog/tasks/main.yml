---
-   name: Is the image already on the server
    community.docker.docker_image_info:
        name: "{{ microblog_image }}"
    register: image_info

-   name: Copy the image to the server
    # The image is saved locally with docker save, see deploy_app.yml. Docker Hub is used by the CD workflow.
    copy:
        src: /tmp/microblog-image.tar
        dest: /tmp/microblog-image.tar
        mode: "644"
    when: image_info.images | length == 0

-   name: Load the image
    community.docker.docker_image_load:
        path: /tmp/microblog-image.tar
    when: image_info.images | length == 0

-   name: Start the Microblog container
    community.docker.docker_container:
        name: microblog
        image: "{{ microblog_image }}"
        state: started
        recreate: true
        restart_policy: unless-stopped
        published_ports:
            - "8000:5000"
        env:
            SECRET_KEY: "{{ app_secret_key }}"
            DATABASE_URL: "mysql+pymysql://microblog:{{ db_password }}@{{ domain_name }}/microblog"
    no_log: true
