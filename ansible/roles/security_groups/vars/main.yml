---
# The IP addresses of the app servers and the load balancer, known after gather_instances has run.
# Before that (when the VMs are created) everyone is allowed, security_groups.yml tightens the rules afterwards.
# kmom03: use these in the rules that should not be open to everyone, instead of '0.0.0.0/0'.
app_sources: "{{ groups.get('appserver', []) | map('regex_replace', '$', '/32') | list or ['0.0.0.0/0'] }}"
lb_sources: "{{ groups.get('loadbalancer', []) | map('regex_replace', '$', '/32') | list or ['0.0.0.0/0'] }}"
sg_groups:
    -   name: loadbalancer
        port_rules:
        -   name: SSH
            protocol: Tcp
            destination_port_range: 22
            access: Allow
            priority: 1001
            direction: Inbound
            source_address_prefix: '0.0.0.0/0'
        -   name: HTTP
            protocol: Tcp
            destination_port_range: 80
            access: Allow
            priority: 1002
            direction: Inbound
            source_address_prefix: '0.0.0.0/0'
        -   name: HTTPS
            protocol: Tcp
            destination_port_range: 443
            access: Allow
            priority: 1003
            direction: Inbound
            source_address_prefix: '0.0.0.0/0'
        -   name: MYSQL # The database runs on the load balancer VM
            protocol: Tcp
            destination_port_range: 3306
            access: Allow
            priority: 1004
            direction: Inbound
            source_address_prefix: "{{ app_sources }}" # only the app servers use the database
    -   name: appserver
        port_rules:
        -   name: SSH
            protocol: Tcp
            destination_port_range: 22
            access: Allow
            priority: 1001
            direction: Inbound
            source_address_prefix: '0.0.0.0/0'
        -   name: APP
            protocol: Tcp
            destination_port_range: 8000
            access: Allow
            priority: 1002
            direction: Inbound
            source_address_prefix: "{{ lb_sources }}" # only the load balancer sends requests to the app
