services:
  dbserver:
    image: mysql/mysql-server:5.7
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: microblog
      MYSQL_USER: microblog
      MYSQL_PASSWORD: ${DB_PASSWORD:-dev-password}
    volumes:
      - db-data:/var/lib/mysql

  prod:
    build:
      context: .
      dockerfile: docker/Dockerfile_prod
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "8000:5000"
    environment:
      SECRET_KEY: ${APP_SECRET_KEY:-dev-secret-key}
      DATABASE_URL: mysql+pymysql://microblog:${DB_PASSWORD:-dev-password}@dbserver/microblog
    depends_on:
      - dbserver

  test:
    build:
      context: .
      dockerfile: docker/Dockerfile_test
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests

volumes:
  db-data:
