services:
  prod:
    build:
      context: .
      dockerfile: docker/Dockerfile_prod
      args:
        APP_VERSION: ${APP_VERSION:-unknown}
    image: microblog:prod
    ports:
      - "8000:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      DATABASE_URL: mysql+pymysql://microblog:${DB_PASSWORD:-dev-db-password}@dbserver/microblog
    depends_on:
      - dbserver

  dbserver:
    image: mysql:5.7
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: microblog
      MYSQL_USER: microblog
      MYSQL_PASSWORD: ${DB_PASSWORD:-dev-db-password}

  test:
    build:
      context: .
      dockerfile: docker/Dockerfile_test
    image: microblog:test
    volumes:
      - ./app:/home/microblog/app
      - ./tests:/home/microblog/tests
