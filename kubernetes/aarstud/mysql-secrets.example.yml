# Copy this file to a place OUTSIDE the repo, put in your own base64 encoded
# throwaway passwords and apply it with `kubectl apply -f <that file>`.
#   echo -n "my-super-secret-root-password" | base64
# Base64 is an encoding, not encryption. Never commit the real file.
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secrets
type: Opaque
data:
  ROOT_PASSWORD: <base64 root password>
  DB_PASSWORD: <base64 password for the microblog user>
---
apiVersion: v1
kind: Secret
metadata:
  name: microblog-secrets
type: Opaque
data:
  SECRET_KEY: <base64 Flask secret key>
